<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0.6 L8,4.5 L0,8.4 z" fill="#7f8a9c"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0.6 L8,4.5 L0,8.4 z" fill="#31d99b"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0.6 L8,4.5 L0,8.4 z" fill="#ff5a2b"/>
    </marker>
  </defs>

  <rect width="1240" height="800" fill="#0d0f13"/>

  <text x="40" y="46" fill="#e8eaef" font-size="24" font-weight="800" letter-spacing="1.4">GRAPPLE — Drei Schichten, eine Wahrheit</text>
  <text x="40" y="72" fill="#8f96a3" font-size="13.5">Das Seil ist gleichzeitig Nebenbedingung (Spielgefühl) und sichtbares Objekt (Glaubwürdigkeit). Beide Anforderungen widersprechen sich — deshalb werden sie getrennt gelöst und über eine gemeinsame Zustandsgröße gekoppelt.</text>

  <!-- Zustandsmaschine -->
  <rect x="40" y="96" width="1160" height="72" rx="11" fill="#141821" stroke="#2a3140"/>
  <text x="60" y="121" fill="#8f96a3" font-size="10.5" font-weight="800" letter-spacing="1.6">SEIL-ZUSTANDSMASCHINE  ·  beschreibt nur, wo das ferne Seilende befestigt ist und ob noch Überschuss eingezogen wird</text>
  <g font-size="13" font-weight="700">
    <rect x="70"  y="130" width="130" height="28" rx="14" fill="#1b2130" stroke="#39414f"/><text x="135" y="149" fill="#8f96a3" text-anchor="middle">IDLE</text>
    <rect x="255" y="130" width="150" height="28" rx="14" fill="#1b2130" stroke="#39414f"/><text x="330" y="149" fill="#c9cfda" text-anchor="middle">FLIGHT</text>
    <rect x="460" y="130" width="160" height="28" rx="14" fill="#1b2130" stroke="#31d99b"/><text x="540" y="149" fill="#31d99b" text-anchor="middle">SETTLING</text>
    <rect x="675" y="130" width="165" height="28" rx="14" fill="#1b2130" stroke="#ff5a2b"/><text x="757" y="149" fill="#ff5a2b" text-anchor="middle">ATTACHED</text>
    <rect x="895" y="130" width="150" height="28" rx="14" fill="#1b2130" stroke="#39414f"/><text x="970" y="149" fill="#8f96a3" text-anchor="middle">RETRACT</text>
  </g>
  <g stroke="#7f8a9c" stroke-width="1.6" fill="none">
    <path d="M200,144 H248" marker-end="url(#ar)"/>
    <path d="M405,144 H453" marker-end="url(#ar)"/>
    <path d="M620,144 H668" marker-end="url(#ar)"/>
    <path d="M840,144 H888" marker-end="url(#ar)"/>
  </g>

  <!-- ============ Schicht 1 ============ -->
  <rect x="40" y="196" width="368" height="330" rx="12" fill="#12161e" stroke="#31d99b" stroke-opacity=".55"/>
  <text x="62" y="226" fill="#31d99b" font-size="14.5" font-weight="800" letter-spacing=".6">(1) TOPOLOGIE — „Wo verläuft das Seil?”</text>
  <text x="62" y="248" fill="#8f96a3" font-size="11.5">reine Geometrie · exakt · deterministisch · rauschfrei</text>

  <g font-size="12" fill="#c9cfda">
    <text x="62" y="272" font-weight="700" fill="#e8eaef">Welt-Pfad s(x)</text>
    <text x="62" y="290" fill="#98a1b0">kürzester kollisionsfreier Pfad Hand → Anker,</text>
    <text x="62" y="304" fill="#98a1b0">um Hindernisse herum (Polylinie)</text>

    <text x="62" y="326" font-weight="700" fill="#e8eaef">Persistente Umlenkkontakte</text>
    <text x="62" y="344" fill="#98a1b0">{ Box, Kante, t, Freigabe-Counter } —</text>
    <text x="62" y="358" fill="#98a1b0">Gedächtnis statt Pro-Frame-Neusuche</text>

    <text x="62" y="380" font-weight="700" fill="#e8eaef">Gleitkontakt, geschlossen gelöst</text>
    <text x="62" y="398" fill="#98a1b0">t* = (a∥·|b⊥| + b∥·|a⊥|) / (|a⊥| + |b⊥|)</text>
    <text x="62" y="412" fill="#98a1b0">→ Kontakt wandert ruckelfrei mit</text>

    <text x="62" y="434" font-weight="700" fill="#e8eaef">Kantenenden</text>
    <text x="62" y="452" fill="#98a1b0">Weitergleiten an Ecken: neuer Kontakt, kein Snap</text>
    <text x="62" y="466" fill="#98a1b0">(auch anderer Boxen) — sonst Abgleiten + Lösen</text>

    <text x="62" y="488" font-weight="700" fill="#e8eaef">Mehrfach-Wicklung</text>
    <text x="62" y="506" fill="#98a1b0">Ablauf darf blockiert sein + Lookahead 1</text>
    <text x="62" y="520" fill="#98a1b0">+ „äußerste Geometrie gewinnt”</text>
  </g>

  <!-- ============ Schicht 2 ============ -->
  <rect x="436" y="196" width="368" height="330" rx="12" fill="#12161e" stroke="#ff5a2b" stroke-opacity=".55"/>
  <text x="458" y="226" fill="#ff5a2b" font-size="14.5" font-weight="800" letter-spacing=".6">(2) DYNAMIK — „Was darf der Spieler?”</text>
  <text x="458" y="248" fill="#8f96a3" font-size="11.5">reine Mechanik · einseitig · auf Velocity-Ebene · ~0.001 ms</text>

  <g font-size="12">
    <rect x="458" y="264" width="324" height="52" rx="8" fill="#1b1410" stroke="#ff5a2b" stroke-opacity=".4"/>
    <text x="620" y="286" fill="#ffd7c7" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">g(x) = s(x) − L  ≤  0</text>
    <text x="620" y="305" fill="#a08878" font-size="10.5" text-anchor="middle">einseitige Constraint auf der WELT-PFADLÄNGE</text>

    <text x="458" y="342" fill="#c9cfda" font-weight="700">n̂ = −Endtangente (Hüllkurpensatz)</text>
    <text x="458" y="360" fill="#98a1b0">weil s minimal ist, tragen die inneren</text>
    <text x="458" y="376" fill="#98a1b0">Kontakte nichts zur Ableitung bei</text>

    <text x="458" y="404" fill="#c9cfda" font-weight="700">v_n &gt; 0  →  v ← v − n̂·v_n</text>
    <text x="458" y="422" fill="#98a1b0">nur die Radialkomponente verschwindet:</text>
    <text x="458" y="438" fill="#31d99b">Tangentialimpuls bleibt ⇒ Pendel entsteht</text>

    <text x="458" y="466" fill="#c9cfda" font-weight="700">v_n &lt; 0  →  nichts</text>
    <text x="458" y="484" fill="#98a1b0">ein Seil kann ziehen, aber nie drücken</text>

    <text x="458" y="512" fill="#c9cfda" font-weight="700">Baumgarte-Bias, nie Position</text>
  </g>

  <!-- ============ Schicht 3 ============ -->
  <rect x="832" y="196" width="368" height="330" rx="12" fill="#12161e" stroke="#4a9bff" stroke-opacity=".5"/>
  <text x="854" y="226" fill="#7fbcff" font-size="14.5" font-weight="800" letter-spacing=".6">(3) DARSTELLUNG — „Wie sieht es aus?”</text>
  <text x="854" y="248" fill="#8f96a3" font-size="11.5">reine Optik, aber physikalisch · Verlet-Kette · ~0.3 ms</text>

  <g font-size="12">
    <rect x="854" y="264" width="324" height="52" rx="8" fill="#0f1620" stroke="#4a9bff" stroke-opacity=".35"/>
    <text x="1016" y="286" fill="#cfe4ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Verlet-Kette: Σ Segmente = Budget L</text>
    <text x="1016" y="305" fill="#cfe4ff" font-size="11" font-weight="700" text-anchor="middle">Enden gepinnt an Hand und Anker/Haken</text>

    <text x="854" y="342" fill="#c9cfda" font-weight="700">Durchhang entsteht von selbst</text>
    <text x="854" y="360" fill="#98a1b0">Bei Spiel hängt das Seil zum Boden und liegt auf</text>
    <text x="854" y="376" fill="#98a1b0">— gemessen: 17.7 m von 17.75 m Budget sichtbar</text>

    <text x="854" y="404" fill="#c9cfda" font-weight="700">Stetig an Umlenkpunkten</text>
    <text x="854" y="422" fill="#98a1b0">Höhe und Steigung knicken nicht — kein V-Knick,</text>
    <text x="854" y="438" fill="#98a1b0">keine Anker-Schlaufe, kein zweiter Bogen</text>

    <text x="854" y="466" fill="#c9cfda" font-weight="700">14 Sweeps, Überrelaxation 1.6</text>
    <text x="854" y="484" fill="#98a1b0">Dehnung 0.8 % unter Eigengewicht,</text>
    <text x="854" y="500" fill="#98a1b0">Peitschen bleibt echte Ketten-Dynamik</text>

    <text x="854" y="522" fill="#c9cfda" font-weight="700">Kollision ist die harte Garantie</text>
  </g>

  <!-- Datenflüsse -->
  <g stroke="#31d99b" stroke-width="2" fill="none">
    <path d="M408,300 H428 V300 H430" marker-end="url(#arG)"/>
  </g>
  <text x="419" y="290" fill="#31d99b" font-size="10" text-anchor="middle" font-weight="700">s, n̂</text>

  <g stroke="#4a9bff" stroke-width="2" fill="none">
    <path d="M804,470 C830,470 810,470 832,470" marker-end="url(#ar)"/>
    <path d="M224,526 C224,600 1016,560 1016,526" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  </g>
  <text x="620" y="588" fill="#7fbcff" font-size="10.5" text-anchor="middle" font-weight="700">Welt-Pfad (nur fürs Neulegen) + Budget + Endpunkte</text>

  <g stroke="#ff5a2b" stroke-width="2" fill="none">
    <path d="M620,526 V556" marker-end="url(#arO)"/>
  </g>
  <text x="640" y="546" fill="#ff5a2b" font-size="10.5" font-weight="700">Velocity-Impuls</text>

  <!-- Geteilte Größe -->
  <rect x="40" y="560" width="1160" height="66" rx="11" fill="#141821" stroke="#2a3140"/>
  <text x="60" y="586" fill="#8f96a3" font-size="10.5" font-weight="800" letter-spacing="1.6">GEMEINSAME ZUSTANDSGRÖSSE</text>
  <text x="60" y="612" fill="#e8eaef" font-size="17" font-weight="800" font-family="ui-monospace,Menlo,Consolas,monospace">L (Budget)   ·   slack = L − s(x)   ·   tensionLevel = 1 − smoothstep(slack/s)</text>
  <text x="1180" y="612" fill="#8f96a3" font-size="11" text-anchor="end">daraus lesen Mechanik, Darstellung, Audio, Kamera, FOV</text>

  <!-- Konsequenzen -->
  <g font-size="11.5">
    <rect x="40" y="646" width="278" height="118" rx="10" fill="#101419" stroke="#232a35"/>
    <text x="58" y="670" fill="#31d99b" font-size="11" font-weight="800" letter-spacing="1.2">STABILITÄT</text>
    <text x="58" y="692" fill="#98a1b0">Ruhelage-Jitter 0.000 mm</text>
    <text x="58" y="710" fill="#98a1b0">max. Überdehnung 0.106 m</text>
    <text x="58" y="728" fill="#98a1b0">30 s Chaos-Betrieb: keine NaN</text>
    <text x="58" y="746" fill="#98a1b0">179 physikalische Assertions grün</text>

    <rect x="334" y="646" width="278" height="118" rx="10" fill="#101419" stroke="#232a35"/>
    <text x="352" y="670" fill="#ffd166" font-size="11" font-weight="800" letter-spacing="1.2">GENAUIGKEIT</text>
    <text x="352" y="692" fill="#98a1b0">Wand-Umlenkung 18.15 m (Optimum 17.88)</text>
    <text x="352" y="710" fill="#98a1b0">Ballistik-Treffer 0.22 m / 36 m</text>
    <text x="352" y="728" fill="#98a1b0">0 Kontakt-Flackern / 200 Schritte</text>
    <text x="352" y="746" fill="#98a1b0">Kontakte springen nie: max. 0.18 m</text>

    <rect x="628" y="646" width="278" height="118" rx="10" fill="#101419" stroke="#232a35"/>
    <text x="646" y="670" fill="#ff5a2b" font-size="11" font-weight="800" letter-spacing="1.2">SPIELGEFÜHL</text>
    <text x="646" y="692" fill="#98a1b0">Tangentialimpuls 12.000 → 12.000</text>
    <text x="646" y="710" fill="#98a1b0">Pumpen: 90.5° → 151.6° Amplitude</text>
    <text x="646" y="728" fill="#98a1b0">Budget-Drift dabei 0.000 m</text>
    <text x="646" y="746" fill="#98a1b0">kein Teleport, kein Positions-Setzen</text>

    <rect x="922" y="646" width="278" height="118" rx="10" fill="#101419" stroke="#232a35"/>
    <text x="940" y="670" fill="#7fbcff" font-size="11" font-weight="800" letter-spacing="1.2">PERFORMANCE</text>
    <text x="940" y="692" fill="#98a1b0">61–452 µs pro Physik-Substep</text>
    <text x="940" y="710" fill="#98a1b0">≈ 0.1–0.9 ms pro Frame (60 Hz)</text>
    <text x="940" y="728" fill="#98a1b0">1–6 % des 16.6-ms-Budgets</text>
    <text x="940" y="746" fill="#98a1b0">7 Raycasts/Substep bei 2 Kontakten</text>
  </g>
</svg>
